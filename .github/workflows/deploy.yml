name: Deploy to Cloudflare

# 推送 main 后由 GitHub Actions 构建并部署（替代 Workers Builds 的 Git 集成）。
# 另：工坊日期同步（Workshop dates）用 GITHUB_TOKEN 提交，不会触发 push 事件，
#     所以额外挂 workflow_run，等它跑完再部署一次。
# 需要的仓库 secret：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Workshop dates"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -d dist/maps
          echo "pages: $(find dist -name 'index.html' | wc -l)"

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Smoke test
        run: |
          code=000
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://ze-map.cn/ || true)
            [ "$code" = "200" ] && break
            sleep 10
          done
          test "$code" = "200" || { echo "站点返回 $code"; exit 1; }
          curl -s https://ze-map.cn/maps/ze_lotr_minas_tirith/ | grep -q "魔戒" || { echo "地图页内容异常"; exit 1; }
          echo "smoke ok"
