# 提交者检查：有人提 PR 时，先在 Linux 上跑一遍和 Cloudflare 一样的构建。
#
# 为什么需要它：
# Cloudflare 的构建只在 main 上跑（控制台里「Builds for non-production branches」
# 没勾选），所以 PR 分支在合并前完全没人验证。2026-09-24 就吃了这个亏——
# 贡献者把 frontmatter 的 tags 写成两个并列数组：
#     tags: ["传送门多"]  ["风景"]  ["多关"]
# YAML 解析直接报「bad indentation of a mapping entry」，而且就算修好 YAML，
# difficulty: 普通 也不在 schema 允许的枚举里，还会再挂一次。
# 这次错误合并进 main 之后，线上构建红叉，站点没能更新。
# 有了这个 workflow，同样的错误会直接显示在 PR 页面上，合并前就能看到。
#
# 地图 MDX 全部由 JSON 和索引生成，但**不要求贡献者提交生成物**：
# Cloudflare 构建时会重新生成，所以「只改 data/research/*.json」的 PR 线上结果是对的，
# 不该被拦。检查只针对一件事 —— **手改生成物**：
#   本次 PR 动了 src/content/maps/*.mdx，却没同时动 data/research/ 或烘焙产物 → 红。
# 判定写在 scripts/content/check-mdx-drift.mjs 里（2026-09-28 从「构建后只要 MDX 有变化
# 就红」改成现在这样：旧的判定会让「只改资料」的 PR 全红，连着卡了贡献者两个 PR，
# 而烘焙管线批量更新时也会误伤）。
#
# 2026-09-24 再补一条「资料文件体检」（npm run content:verify）：
# 有位贡献者的 data/research/*.json 里漏了逗号、引号没闭合、字段名后面漏冒号，
# 一共 4 处语法错误 —— 但 CI 显示的是绿勾。原因是生成脚本对读不动的资料文件
# 只打一行 console.warn 就当它不存在，于是整份内容被忽略、页面退回「暂无资料」，
# 而构建照常成功。这是最坏的一种失败：**改动静默消失，且没有任何红灯**。
# 现在两边都堵上了：
#   - 生成脚本遇到坏资料文件直接 exit 1（见 generate-map-entries.mjs）；
#   - 这里先跑一次 content:verify，把文件名和具体出错位置打在 PR 页面上。
#
# 说明：
# - 公开仓库的 Actions 额度免费，这个任务约 1~2 分钟。
# - 跑在 ubuntu 上还有个额外好处：Linux 文件系统大小写敏感，能提前抓出
#   「Windows 本地能过、线上 404」的标签目录/路径大小写问题（踩过一次）。
# - 不部署、不需要任何密钥，只做「构建 + 查站内死链」。
# - Node 用 22（对应 npm 10.x），与 Cloudflare 构建环境保持一致。

name: Build check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 下面那步要拿 PR 的 base commit 做 diff，必须完整拉取
          fetch-depth: 0

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 检查资料文件（JSON 格式、难度写法、来源链接等）
        run: npm run content:verify

      - name: 检查人工封面（文件名对不对得上地图、格式、体积）
        run: npm run cover:verify

      - name: 构建站点
        run: npm run build

      - name: 检查地图条目（是不是手改了生成物）
        run: npm run content:mdx

      # GLSL 的跨阶段 uniform 精度不一致只在手机内核上炸（桌面 ANGLE 放行），
      # 电脑上永远复现不了，所以做成静态检查（2026-10-05 夸克/华为机的 3D 打不开就是这个）
      - name: 检查 3D 着色器（跨阶段 uniform 精度必须一致）
        run: npm run content:shaders

      - name: 检查站内死链
        run: npm run content:links
