# 工坊版本日期自动同步（2026-10-18 加，2026-10-20 改成公开仓库直连）
#
# 干什么：每天拉一次社区那份「工坊版本记录」的 manifest，跑
#   scripts/content/sync-workshop-dates.mjs → 更新 data/workshop-updates.json
# 有变化才提交；提一次 Cloudflare Workers Builds 就重建，条目页的「工坊最近更新」跟着更新。
#
# 数据来源：风云社（FYS）MapTracking-CS2 的公开追踪仓库（站点「关于」页有署名）。
#   ⚠️ 以前把地址放在 Repository Secret `WORKSHOP_TRACK_REPO` 里，没配就一直静默跳过；
#   仓库本来就是公开的、署名也已经在 /about/ 上，2026-10-20 改成直接写在这里，
#   不再需要任何 secret。
#
# 只在 schedule / 手动触发时跑，不监听 push —— 否则机器人自己的提交会再触发一轮，无限循环。
# 手动跑：Actions → Workshop dates → Run workflow。
name: Workshop dates

on:
  schedule:
    # 每天 03:17 UTC = 北京时间 11:17（避开整点，给 Cloudflare 构建错峰）
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: workshop-dates
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRACK_REPO: https://github.com/fyscs/MapTracking-CS2
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 稀疏拉取版本记录（只取 manifest.json）
        run: |
          git clone --depth 1 --filter=blob:none --sparse "$TRACK_REPO" _mt
          git -C _mt sparse-checkout set --no-cone '2001/*/*/manifest.json'
          echo "manifest 数量：$(find _mt/2001 -name manifest.json | wc -l)"

      - name: 同步到 data/workshop-updates.json
        run: node scripts/content/sync-workshop-dates.mjs --repo _mt

      - name: 有变化就提交并推送
        run: |
          set -e
          if git diff --quiet -- data/workshop-updates.json; then
            echo "没有变化，不提交"
            exit 0
          fi
          mmdd="$(date -u +%m.%d)"
          n=$(( $(git rev-list --count --since="$(date -u +%Y-%m-%d)T00:00:00Z" HEAD) + 1 ))
          git config user.name "hhjjdsj"
          git config user.email "hhjjdsj@users.noreply.github.com"
          git add data/workshop-updates.json
          git commit -m "update ${mmdd}.${n}"
          git push
      - name: 失败提示
        if: failure()
        run: |
          echo "## ❌ 工作流失败" >> "$GITHUB_STEP_SUMMARY"
          echo "查看日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
